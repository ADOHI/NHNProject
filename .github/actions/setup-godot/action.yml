name: Setup Godot
description: 공식 릴리스에서 Godot 엔진과 (선택적으로) 익스포트 템플릿을 설치한다

inputs:
  version:
    description: Godot 버전 (예 4.7.1). stable 채널만 지원한다
    required: true
  export-templates:
    description: 익스포트 템플릿까지 설치할지 여부. 빌드가 아닌 작업에서는 'false' 로 두면 훨씬 빠르다
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install Godot ${{ inputs.version }}
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.version }}
        WITH_TEMPLATES: ${{ inputs.export-templates }}
      run: |
        set -euo pipefail
        BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"

        curl -fL -o godot.zip "${BASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
        unzip -q godot.zip
        sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
        sudo chmod +x /usr/local/bin/godot
        rm -f godot.zip

        # 템플릿은 1GB 에 가깝다. 익스포트하지 않는 작업에서는 받지 않는다.
        if [ "${WITH_TEMPLATES}" = "true" ]; then
          curl -fL -o tpl.tpz "${BASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          # .tpz 는 templates/ 폴더 하나를 담은 zip 이다.
          # Godot 은 <data>/export_templates/<version>.stable/ 에서 템플릿을 찾는다.
          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL_DIR"
          unzip -q tpl.tpz -d tpl
          mv tpl/templates/* "$TPL_DIR/"
          rm -rf tpl tpl.tpz
        fi

        godot --version
