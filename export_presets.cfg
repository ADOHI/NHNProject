[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; 테스트 코드와 테스트 프레임워크는 빌드에 포함하지 않는다.
; 웹 빌드는 다운로드 용량이 곧 이탈률이므로 3MB 도 그냥 넘기지 않는다.
; src/proto/* 는 **버리려고 만든 프로토타입**이다 (이동 · 애니 조절판 · 조명 · 효과음
; 데모). 파일을 지우는 것이 아니라 **내보내기에서만 뺀다** — 에디터와 헤드리스에서는
; 그대로 돌아야 tools/capture_*.gd 와 시험이 산다 (docs/refactoring-2026-08-19.md §1.5).
exclude_filter="test/*, addons/gut/*, assets/audio/sfx/*, src/proto/*"
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell="res://web/shell.html"
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)

[preset.1]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; 테스트 코드와 테스트 프레임워크는 빌드에 포함하지 않는다.
; assets/audio/sfx/ 는 CC0 원본 녹음이고 **굽는 재료**다 — 게임이 싣는 것은
; assets/audio/sfx_baked/ 이므로 원본은 빼도 소리가 안 죽는다 (docs/design/29-sound.md).
; src/proto/* 는 **버리려고 만든 프로토타입**이다. 웹 프리셋과 같은 이유로 뺀다 —
; 파일을 지우는 것이 아니라 **내보내기에서만** 뺀다 (docs/refactoring-2026-08-19.md §1.5).
exclude_filter="test/*, addons/gut/*, assets/audio/sfx/*, src/proto/*"
export_path="build/windows/Geum.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name=""
application/product_name=""
application/file_description=""
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false
